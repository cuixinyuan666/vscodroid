name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags and history are needed to compare this release against the
          # previous one. The default shallow fetch has neither, and the
          # comparison would quietly pass by finding nothing.
          fetch-depth: 0

      # A tag whose versionName does not match the one in build.gradle.kts is the
      # quietest way to ship a broken upgrade. FirstRunSetup.isFirstRun() gates on
      # versionName, so an unchanged one means existing installs skip setup
      # entirely: no extraction, and no migration, while the release itself looks
      # completely normal. Nothing downstream notices, and the symptom on a device
      # is an app running against files from the previous version.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Through the environment and validated before use: the tag reaches a
          # git command below, and the workflow's v* filter is a match rule, not
          # a guarantee about the rest of the name.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Refusing tag $TAG; expected vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

          gradle_file=android/app/build.gradle.kts
          version_name=$(grep -m1 'versionName = ' "$gradle_file" | sed 's/.*"\(.*\)".*/\1/')
          version_code=$(grep -m1 'versionCode = ' "$gradle_file" | sed 's/[^0-9]*//g')
          tag_version=${TAG#v}

          echo "tag          : $TAG"
          echo "versionName  : $version_name"
          echo "versionCode  : $version_code"

          if [ "$tag_version" != "$version_name" ]; then
            echo "::error::Tag $TAG does not match versionName $version_name in $gradle_file." \
                 "Existing installs gate first-run setup on versionName, so releasing this" \
                 "would skip extraction and migrations for every upgrading user."
            exit 1
          fi

          # versionCode is what migrations threshold against; a repeat means a
          # migration written for this release runs for nobody.
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$previous" ]; then
            previous_code=$(git show "$previous:$gradle_file" 2>/dev/null \
              | grep -m1 'versionCode = ' | sed 's/[^0-9]*//g' || echo "")
            if [ -n "$previous_code" ] && [ "$version_code" -le "$previous_code" ]; then
              echo "::error::versionCode $version_code is not greater than $previous_code in $previous." \
                   "Migrations threshold on versionCode and would not run."
              exit 1
            fi
            echo "previous tag : $previous (versionCode ${previous_code:-unknown})"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up NDK
        run: |
          sdkmanager "ndk;27.2.12479018" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install system dependencies
        # See build.yml: the runner's baked apt index goes stale as Ubuntu drops
        # superseded versions from the pool, so refresh it before installing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools zstd zip

      # Cache downloaded tarballs/debs
      - name: Cache download intermediates
        uses: actions/cache@v4
        with:
          path: |
            server/*.tar.gz
            toolchains/termux-packages/*.deb
            toolchains/termux-packages/Packages
            toolchains/build/npm/
            toolchains/extensions/
          key: downloads-${{ hashFiles('scripts/download-vscode-server.sh', 'scripts/download-termux-tools.sh', 'scripts/download-npm.sh', 'scripts/download-python.sh', 'scripts/download-extensions.sh') }}
          restore-keys: |
            downloads-

      # Download and prepare all core assets
      - name: Download VS Code Server
        run: bash scripts/download-vscode-server.sh

      - name: Copy VS Code Server to assets
        run: |
          mkdir -p android/app/src/main/assets/
          rm -rf android/app/src/main/assets/vscode-reh
          cp -r server/vscode-reh android/app/src/main/assets/vscode-reh

      - name: Download Termux tools
        run: bash scripts/download-termux-tools.sh

      - name: Download npm
        run: bash scripts/download-npm.sh

      - name: Download Python
        run: bash scripts/download-python.sh

      - name: Download extensions
        run: bash scripts/download-extensions.sh

      - name: Build native addons
        run: bash scripts/build-native-addons.sh

      # libnode.so must exist as a GitHub release asset or be downloadable via LIBNODE_URL.
      - name: Fetch libnode.so
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIBNODE_URL: ${{ secrets.LIBNODE_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          LIBNODE="android/app/src/main/jniLibs/arm64-v8a/libnode.so"
          if [ -f "$LIBNODE" ] && [ "$(wc -c < "$LIBNODE")" -gt 1000 ]; then
            echo "libnode.so already exists ($(du -sh "$LIBNODE" | cut -f1))"
            exit 0
          fi
          # Try direct URL first
          if [ -n "${LIBNODE_URL:-}" ]; then
            echo "Downloading libnode.so from LIBNODE_URL..."
            curl -L --fail --show-error -o "$LIBNODE" "$LIBNODE_URL"
            echo "Downloaded ($(du -sh "$LIBNODE" | cut -f1))"
            exit 0
          fi
          # Try current tag's release, then any release with libnode.so
          for tag in "$TAG" ""; do
            FLAG=""
            [ -n "$tag" ] && FLAG="--tag $tag"
            echo "Trying: gh release download $FLAG --pattern libnode.so ..."
            if gh release download --repo "$REPO" $FLAG \
                 --pattern "libnode.so" \
                 --dir android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null; then
              echo "Downloaded ($(du -sh "$LIBNODE" | cut -f1))"
              exit 0
            fi
          done
          echo "ERROR: libnode.so not found in any release. Upload it to a release first."
          exit 1

      - name: Verify assets
        run: |
          echo "=== Assets ==="
          ls -la android/app/src/main/assets/ || true
          echo ""
          echo "=== jniLibs ==="
          ls -la android/app/src/main/jniLibs/arm64-v8a/ || true
          echo ""
          LIBNODE="android/app/src/main/jniLibs/arm64-v8a/libnode.so"
          LIBNODE_SIZE="$(wc -c < "$LIBNODE")"
          if [ "$LIBNODE_SIZE" -lt 1000 ]; then
            echo "ERROR: libnode.so is too small ($LIBNODE_SIZE bytes). Release build requires a real binary."
            exit 1
          fi

      # Decode signing keystore from base64 secret
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks

      - name: Build signed APK
        working-directory: android
        env:
          VSCODROID_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore.jks
          VSCODROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VSCODROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VSCODROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # AAB requires toolchain asset packs (~360 MB) which aren't in git.
      # AAB is built locally for Play Store upload. CI only builds APK for GitHub Releases.

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools zstd zip

      - name: Download toolchain assets
        run: |
          bash scripts/download-go.sh
          bash scripts/download-ruby.sh
          bash scripts/download-java.sh

      - name: Package toolchain ZIPs
        run: bash scripts/package-toolchains.sh

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name "*.apk" -exec sha256sum {} \; > checksums.sha256
          for zip in ../toolchain-zips/*.zip; do
            [ -f "$zip" ] && sha256sum "$zip" >> checksums.sha256
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.apk
            toolchain-zips/*.zip
            artifacts/checksums.sha256
